app = "expenses-private-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/expenses.sqlite3"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "expenses_data"
  destination = "/data"
